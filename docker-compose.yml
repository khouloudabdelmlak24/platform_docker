services:
  mysql:
    image: mysql:8.0
    container_name: sante_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: sante_digitale_v2
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./platform
    container_name: sante_backend
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
    ports:
      - "8082:8082"

  frontend:
    build: ./frontend
    container_name: sante_frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

  ia_service:
    build: ../ia_service
    container_name: sante_ia
    ports:
      - "8001:8001"

volumes:
  mysql_data: